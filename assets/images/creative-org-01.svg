<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1820"/>
      <stop offset="100%" stop-color="#161226"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#orgGrad)"/>

  <!-- Organization Campus Visual -->
  <rect x="70" y="60" width="460" height="280" rx="14" fill="#111722" stroke="#27272A" stroke-width="1.5"/>

  <!-- Org Mascot / Emblem badge -->
  <circle cx="300" cy="140" r="45" fill="#1A2436" stroke="#00D9FF" stroke-width="2"/>
  <text x="300" y="148" font-size="28" text-anchor="middle">🎓</text>

  <text x="300" y="225" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">STUDENT IT SOCIETY</text>
  <text x="300" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle">Department Publication &amp; Newsletter Cover</text>

  <g transform="translate(180, 275)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1"/>
    <text x="55" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#E4E4E7" text-anchor="middle">ISSUE NO. 04</text>

    <rect x="130" y="0" width="110" height="28" rx="6" fill="#00D9FF" fill-opacity="0.2" stroke="#00D9FF" stroke-width="1"/>
    <text x="185" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#E4E4E7" text-anchor="middle">BSIT CHAPTER</text>
  </g>

  <text x="300" y="390" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Organization Graphics</text>
  <text x="300" y="415" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D9FF" text-anchor="middle">Community Publications &amp; Editorial Assets</text>
</svg>
