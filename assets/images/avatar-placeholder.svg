<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1033"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a1926"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#avatarGrad)"/>
  
  <!-- Subtle Matrix / Grid Lines -->
  <path d="M50 0v400 M100 0v400 M150 0v400 M200 0v400 M250 0v400 M300 0v400 M350 0v400" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M0 50h400 M0 100h400 M0 150h400 M0 200h400 M0 250h400 M0 300h400 M0 350h400" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Outer Geometric Tech Halo -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>

  <!-- Developer Silhouette Silhouette & Headset / Code Persona -->
  <g fill="none" stroke="#27272A" stroke-width="2">
    <!-- Shoulder curve -->
    <path d="M90 360 C 110 270, 290 270, 310 360" fill="#15151e" stroke="url(#ringGrad)" stroke-width="2"/>
    <!-- Head -->
    <circle cx="200" cy="190" r="60" fill="#181824" stroke="#3F3F46" stroke-width="2"/>
  </g>

  <!-- Developer Code Bracket Overlay -->
  <g filter="url(#glow)">
    <text x="200" y="198" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#00D9FF" text-anchor="middle">&lt;DEV/&gt;</text>
  </g>

  <!-- Status / Year Indicator -->
  <rect x="120" y="325" width="160" height="28" rx="14" fill="#0A0A0A" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="343" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E4E4E7" text-anchor="middle">BSIT DEVELOPER</text>
</svg>
