<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c181f"/>
      <stop offset="100%" stop-color="#11242e"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#pythonGrad)"/>

  <!-- Terminal Window Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#132029" stroke="#1f3745" stroke-width="1"/>
  <circle cx="25" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="45" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="65" cy="21" r="5.5" fill="#10B981"/>
  <text x="100" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">python3 cooking_quests.py --interactive-mode</text>

  <!-- Split Screen: Left Console Terminal / Right Recipe Quest HUD -->
  <!-- Left Console Box -->
  <rect x="30" y="65" width="440" height="395" rx="8" fill="#080e13" stroke="#1c303c" stroke-width="1"/>
  <text x="50" y="98" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00D9FF">&gt;&gt;&gt; [COOKING QUESTS ENGINE INITIALIZED]</text>
  <text x="50" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">2nd Year BSIT • Python Programming Project</text>

  <text x="50" y="160" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A78BFA">def prepare_recipe(ingredients, temperature):</text>
  <text x="70" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E4E4E7">    score = calculate_flavor_profile(ingredients)</text>
  <text x="70" y="200" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E4E4E7">    if temperature &gt;= OPTIMAL_BAKE:</text>
  <text x="90" y="220" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34D399">        return "Master Chef Quest Cleared! ⭐⭐⭐"</text>
  
  <text x="50" y="260" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00D9FF">[QUEST LOG 04]: Golden Sauté Challenge</text>
  <text x="50" y="285" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E4E4E7">Current Inventory: [Garlic, Olive Oil, Fresh Basil]</text>
  <text x="50" y="310" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E4E4E7">Cooking Time Remaining: 02:45s</text>
  <text x="50" y="335" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">Action Selected: Simmer at 180°C</text>
  <text x="50" y="370" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FBBF24">&gt; Player Chef XP: +350 PTS [Level Up!]</text>
  <text x="50" y="415" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38BDF8">&gt; Enter next command: _</text>

  <!-- Right Visual Quest HUD -->
  <rect x="490" y="65" width="280" height="395" rx="8" fill="#0b171e" stroke="#1c303c" stroke-width="1"/>
  <text x="510" y="100" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">🍳 Quest Status</text>
  <text x="510" y="120" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8">Chef Apprentice Rank 2</text>

  <!-- Quest Badge Cards -->
  <rect x="510" y="145" width="240" height="70" rx="6" fill="#122530" stroke="#1c303c" stroke-width="1"/>
  <text x="525" y="172" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Golden Soup Recipe</text>
  <text x="525" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">✓ COMPLETED (100%)</text>

  <rect x="510" y="230" width="240" height="70" rx="6" fill="#122530" stroke="#1c303c" stroke-width="1"/>
  <text x="525" y="257" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Spice Master Challenge</text>
  <text x="525" y="280" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">⌛ IN PROGRESS (65%)</text>

  <rect x="510" y="315" width="240" height="70" rx="6" fill="#122530" stroke="#1c303c" stroke-width="1"/>
  <text x="525" y="342" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Royal Feast Banquet</text>
  <text x="525" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">🔒 LOCKED (Req. Lvl 3)</text>
</svg>
