<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="60%" stop-color="#0e101a"/>
      <stop offset="100%" stop-color="#0a1926"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#posterGrad)"/>
  
  <!-- Abstract Design Shapes -->
  <circle cx="450" cy="120" r="140" fill="#7C3AED" fill-opacity="0.2"/>
  <circle cx="150" cy="320" r="110" fill="#00D9FF" fill-opacity="0.15"/>
  <rect x="180" y="60" width="240" height="300" rx="16" fill="#151522" stroke="#27272A" stroke-width="1.5"/>

  <!-- Inner Poster Content -->
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <polygon points="300,110 370,220 230,220"/>
  </g>
  <circle cx="300" cy="180" r="28" fill="#00D9FF" fill-opacity="0.4"/>

  <text x="300" y="275" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CREATIVE POSTER</text>
  <text x="300" y="300" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA" text-anchor="middle">TYPOGRAPHY &amp; VISUAL DESIGN</text>
  
  <rect x="220" y="320" width="160" height="24" rx="12" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1"/>
  <text x="300" y="336" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#E4E4E7" text-anchor="middle">SAMPLE PLACEHOLDER</text>
</svg>
