<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#uiGrad)"/>
  
  <!-- Mobile App Frame / UI Mockup -->
  <g transform="translate(130, 40)">
    <!-- Phone Mockup 1 -->
    <rect x="0" y="0" width="160" height="320" rx="20" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="50" y="8" width="60" height="12" rx="6" fill="#030712"/>
    <rect x="15" y="35" width="130" height="40" rx="8" fill="#1F2937"/>
    <rect x="15" y="85" width="60" height="60" rx="8" fill="#00D9FF" fill-opacity="0.2" stroke="#00D9FF"/>
    <rect x="85" y="85" width="60" height="60" rx="8" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED"/>
    <rect x="15" y="155" width="130" height="120" rx="8" fill="#1F2937"/>
  </g>

  <g transform="translate(310, 70)">
    <!-- Phone Mockup 2 -->
    <rect x="0" y="0" width="160" height="290" rx="20" fill="#0F172A" stroke="#7C3AED" stroke-width="2"/>
    <rect x="50" y="8" width="60" height="12" rx="6" fill="#020617"/>
    <circle cx="80" cy="80" r="35" fill="#7C3AED" fill-opacity="0.3"/>
    <rect x="25" y="135" width="110" height="18" rx="4" fill="#334155"/>
    <rect x="35" y="165" width="90" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="200" width="120" height="36" rx="18" fill="#7C3AED"/>
  </g>

  <text x="300" y="405" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">UI / UX Concept Layout</text>
  <text x="300" y="425" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D9FF" text-anchor="middle">Mobile &amp; Web Interface Design</text>
</svg>
